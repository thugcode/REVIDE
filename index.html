<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Revide</title>
<meta name="description" content="인스타·유튜브에서 저장만 하고 잊는 숏폼을 자동으로 분류하고, 같은 주제끼리 노트로 묶어 다시 꺼내 보는 보관함">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Revide">
<style>
/* Apple 웹 톤 토큰: 색 6 · 글자 6단계 · 여백 8단계 · 모서리 · 그림자 */
:root{
  --ink:#1d1d1f; --canvas:#ffffff; --parchment:#f5f5f7; --action-blue:#0066cc; --ink-muted:#7a7a7a; --hairline:#e0e0e0;
  --fs-xs:12px; --fs-sm:14px; --fs-md:17px; --fs-lg:21px; --fs-xl:28px; --fs-2xl:56px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:17px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:80px;
  --radius-sm:8px; --radius-md:11px; --radius-lg:18px; --radius-pill:9999px;
  --shadow-product:3px 5px 30px 0 rgba(0,0,0,0.22);
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Helvetica Neue",Arial,sans-serif;
  --tabbar-h:0px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--parchment)}
body{color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-md);line-height:1.47;letter-spacing:-0.374px;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--canvas)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--action-blue)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--action-blue);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-variant-numeric:tabular-nums}

/* 상단 바 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--canvas);border-bottom:1px solid var(--hairline)}
.top .wrap{display:flex;align-items:center;gap:var(--space-5);padding-block:var(--space-3)}
.brand{font-size:var(--fs-lg);font-weight:600;letter-spacing:0.231px;text-decoration:none;color:var(--ink)}
.tabbar{display:flex;gap:var(--space-1);margin-left:auto}
.tabbar a{display:inline-flex;align-items:center;gap:var(--space-1);text-decoration:none;color:var(--ink);border-radius:var(--radius-pill);padding:var(--space-1) var(--space-4);font-size:var(--fs-sm);letter-spacing:-0.224px}
.tabbar a[aria-current="page"]{background:var(--ink);color:var(--canvas)}
.badge{min-width:20px;height:20px;border-radius:var(--radius-pill);background:var(--action-blue);color:var(--canvas);font-size:var(--fs-xs);font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.tabbar svg{display:none}

/* 공통 */
main{padding-block:var(--space-6) var(--space-8)}
.view{display:flex;flex-direction:column;gap:var(--space-5)}
h1.page{font-size:var(--fs-xl);line-height:1.14;font-weight:600;letter-spacing:0.196px;margin:0}
.lede{font-size:var(--fs-md);margin:0;max-width:640px}
.row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:var(--radius-pill);padding:var(--space-2) var(--space-5);font-size:var(--fs-md);line-height:1.24;background:var(--action-blue);color:var(--canvas);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);white-space:nowrap}
.btn:disabled{background:var(--hairline);color:var(--ink);cursor:default}
.btn.sm{padding:var(--space-1) var(--space-4);font-size:var(--fs-sm);letter-spacing:-0.224px;line-height:1.43}
.btn.line{background:var(--canvas);color:var(--action-blue);box-shadow:inset 0 0 0 1px var(--action-blue)}
.btn.quiet{background:transparent;color:var(--ink);padding-inline:var(--space-2)}
.btn.dark{background:var(--ink);color:var(--canvas)}
.card{background:var(--canvas);border-radius:var(--radius-lg);border:1px solid var(--hairline);padding:var(--space-5)}
.hint{font-size:var(--fs-xs);letter-spacing:-0.12px;margin:0}
.msg{font-size:var(--fs-sm);letter-spacing:-0.224px;min-height:1.43em;margin:0}
.chip{border:1px solid var(--ink-muted);background:var(--canvas);border-radius:var(--radius-pill);padding:var(--space-1) var(--space-4);font-size:var(--fs-sm);letter-spacing:-0.224px;display:inline-flex;align-items:center;gap:var(--space-2);line-height:1.43;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.chip .n{font-weight:600;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:var(--space-2);overflow-x:auto;padding-bottom:var(--space-1);scrollbar-width:thin}
.tools{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--ink-muted);background:var(--canvas);border-radius:var(--radius-md);padding:var(--space-2) var(--space-4)}
.search::placeholder{color:var(--ink)}
.search:focus,.input:focus{outline:2px solid var(--action-blue);outline-offset:0;border-color:var(--action-blue)}
.input{width:100%;min-width:0;border:1px solid var(--ink-muted);background:var(--canvas);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);font-size:var(--fs-md)}
.input::placeholder{color:var(--ink)}
.seg{display:inline-flex;background:var(--canvas);border:1px solid var(--ink-muted);border-radius:var(--radius-pill);padding:var(--space-1);gap:var(--space-1)}
.seg button{border:0;background:transparent;border-radius:var(--radius-pill);padding:var(--space-1) var(--space-4);font-size:var(--fs-sm);letter-spacing:-0.224px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--canvas)}
.banner{display:flex;gap:var(--space-3);align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--canvas);border-radius:var(--radius-lg);border:1px solid var(--hairline);padding:var(--space-4) var(--space-5)}
.banner b{font-size:var(--fs-md)}
.banner.blue{border-color:var(--action-blue)}

/* 담기 */
.addbar{display:flex;gap:var(--space-3);background:var(--canvas);border-radius:var(--radius-lg);box-shadow:var(--shadow-product);padding:var(--space-3)}
.addbar input{flex:1;min-width:0;border:0;padding:var(--space-2) var(--space-3);font-size:var(--fs-md);background:transparent}
.addbar input::placeholder{color:var(--ink)}
.addbar input:focus{outline:none}

/* 목록 */
.list{background:var(--canvas);border-radius:var(--radius-lg);border:1px solid var(--hairline);display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:72px 1fr;gap:var(--space-4);padding:var(--space-4) var(--space-5);border-top:1px solid var(--hairline);align-items:start}
.item:first-child{border-top:0}
a:has(>.thumb),a:has(>.tthumb){text-decoration:none;color:var(--ink);flex:none}
.thumb{width:72px;height:96px;border-radius:var(--radius-md);background:var(--parchment);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:600;text-align:center;overflow:hidden;color:var(--ink)}
.item .body{min-width:0;display:flex;flex-direction:column;gap:var(--space-1)}
.item .title{font-size:var(--fs-md);line-height:1.35;font-weight:600;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .title a{color:inherit;text-decoration:none}
.item .title a:hover{color:var(--action-blue)}
.item.seen .title{font-weight:400}
.meta{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);font-size:var(--fs-sm);letter-spacing:-0.224px;align-items:center}
.src{font-weight:600}
.pill{font-size:var(--fs-xs);font-weight:600;border-radius:var(--radius-sm);padding:0 var(--space-2);border:1px solid var(--ink);line-height:1.6}
.pill.blue{color:var(--action-blue);border-color:var(--action-blue)}
.acts{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;margin-top:var(--space-2)}
.acts select,.catsel{border:1px solid var(--ink-muted);background:var(--canvas);border-radius:var(--radius-pill);padding:var(--space-1) var(--space-3);font-size:var(--fs-sm);max-width:140px}
details.more{position:relative}
details.more summary{list-style:none;cursor:pointer;border-radius:var(--radius-pill);padding:var(--space-1) var(--space-3);font-size:var(--fs-sm)}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{background:var(--parchment)}
.menu{position:absolute;right:0;z-index:5;margin-top:var(--space-1);background:var(--canvas);border-radius:var(--radius-md);box-shadow:var(--shadow-product);padding:var(--space-2);display:flex;flex-direction:column;gap:var(--space-1);min-width:200px}
.menu button,.menu select{text-align:left;border:0;background:transparent;border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);font-size:var(--fs-sm)}
.menu button:hover{background:var(--parchment)}
.menu select{border:1px solid var(--ink-muted);border-radius:var(--radius-pill)}
.menu .danger[data-arm]{font-weight:600;text-decoration:underline}
.memo-in{width:100%;border:1px solid var(--ink-muted);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);font-size:var(--fs-sm)}
.extract{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.notechips{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.notechip{border:1px solid var(--action-blue);color:var(--action-blue);background:var(--canvas);border-radius:var(--radius-pill);padding:0 var(--space-3);font-size:var(--fs-sm);letter-spacing:-0.224px;line-height:1.6}
.notechip:hover{background:var(--action-blue);color:var(--canvas)}
.empty{padding:var(--space-7) var(--space-5);display:flex;flex-direction:column;gap:var(--space-2);text-align:center;align-items:center}
.empty b{font-size:var(--fs-lg);line-height:1.19}
.empty span{font-size:var(--fs-sm);max-width:420px}

/* 받은 함 정리 */
.triage{background:var(--canvas);border-radius:var(--radius-lg);box-shadow:var(--shadow-product);padding:var(--space-5);display:grid;grid-template-columns:200px 1fr;gap:var(--space-5);align-items:start}
.triage .tthumb{width:200px;aspect-ratio:3/4;max-width:100%;border-radius:var(--radius-md);object-fit:cover;background:var(--parchment);display:flex;align-items:center;justify-content:center;font-weight:600}
.triage .tbody{display:flex;flex-direction:column;gap:var(--space-3);min-width:0}
.triage h2{font-size:var(--fs-lg);line-height:1.19;margin:0;word-break:break-word}
.triage .desc{font-size:var(--fs-sm);letter-spacing:-0.224px;margin:0;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.catgrid{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.catbtn{border:1px solid var(--ink-muted);background:var(--canvas);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-4);font-size:var(--fs-md)}
.catbtn.sug{border-color:var(--action-blue);color:var(--action-blue);font-weight:600}
.catbtn.top{background:var(--action-blue);color:var(--canvas);border-color:var(--action-blue)}
.progress{font-size:var(--fs-sm);letter-spacing:-0.224px}
@media (prefers-reduced-motion:no-preference){.triage{animation:pop .22s ease-out both}@keyframes pop{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* 노트 */
.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--space-5)}
.ncard{text-decoration:none;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--radius-lg);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-2);color:var(--ink);min-width:0}
.ncard:hover{border-color:var(--action-blue)}
.ncard h3{font-size:var(--fs-lg);line-height:1.19;font-weight:600;letter-spacing:0.231px;margin:0;word-break:break-word}
.ncard .ex{font-size:var(--fs-sm);letter-spacing:-0.224px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ncard .foot{font-size:var(--fs-xs);letter-spacing:-0.12px;margin-top:auto;font-variant-numeric:tabular-nums}
.tagrow{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.tag{font-size:var(--fs-xs);letter-spacing:-0.12px;border:1px solid var(--ink);border-radius:var(--radius-pill);padding:0 var(--space-2);line-height:1.6;white-space:nowrap}
.prop{background:var(--canvas);border-radius:var(--radius-lg);box-shadow:var(--shadow-product);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-2)}
.prop h3{margin:0;font-size:var(--fs-lg);line-height:1.19}
.prop ul{margin:0;padding-left:var(--space-5);font-size:var(--fs-sm);letter-spacing:-0.224px}
.backrow{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.detail{background:var(--canvas);border-radius:var(--radius-lg);border:1px solid var(--hairline);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5);min-width:0}
.title-in{width:100%;min-width:0;border:0;border-bottom:1px solid var(--hairline);background:transparent;font-size:var(--fs-xl);line-height:1.14;font-weight:600;letter-spacing:0.196px;padding:var(--space-1) 0}
.title-in:focus{outline:none;border-bottom:2px solid var(--action-blue)}
.tags-in{width:100%;min-width:0;border:1px solid var(--ink-muted);border-radius:var(--radius-pill);background:var(--canvas);padding:var(--space-1) var(--space-4);font-size:var(--fs-sm)}
.tags-in::placeholder{color:var(--ink)}
.tags-in:focus{outline:2px solid var(--action-blue);outline-offset:0;border-color:var(--action-blue)}
.editor{width:100%;min-width:0;min-height:340px;border:1px solid var(--ink-muted);border-radius:var(--radius-md);padding:var(--space-4);font:inherit;font-size:var(--fs-md);line-height:1.6;color:var(--ink);background:var(--canvas);resize:vertical}
.editor:focus{outline:2px solid var(--action-blue);outline-offset:0;border-color:var(--action-blue)}
.md{min-width:0;word-break:break-word}
.md>*:first-child{margin-top:0}
.md h2{font-size:var(--fs-xl);line-height:1.14;margin:var(--space-5) 0 var(--space-2)}
.md h3{font-size:var(--fs-lg);line-height:1.19;font-weight:600;margin:var(--space-5) 0 var(--space-2)}
.md h4{font-size:var(--fs-md);font-weight:600;margin:var(--space-4) 0 var(--space-1)}
.md p{margin:0 0 var(--space-3)}
.md ul,.md ol{margin:0 0 var(--space-3);padding-left:var(--space-5)}
.md ul.tasks{list-style:none;padding-left:0}
.md li{margin:var(--space-1) 0}
.md li.task label{display:flex;gap:var(--space-2);align-items:flex-start;cursor:pointer}
.md li.task input{margin-top:6px;width:16px;height:16px;accent-color:var(--action-blue)}
.md li.task.done span{text-decoration:line-through}
.md blockquote{margin:0 0 var(--space-3);background:var(--parchment);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4)}
.md code{font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-sm);background:var(--parchment);border-radius:var(--radius-sm);padding:0 var(--space-1)}
.md pre{background:var(--parchment);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);overflow-x:auto}
.md pre code{background:transparent;padding:0}
.md hr{border:0;border-top:1px solid var(--hairline);margin:var(--space-5) 0}
.md mark{background:var(--parchment);color:var(--ink);font-weight:600}
.wikilink{text-decoration:none;font-weight:600}
.wikilink:hover{text-decoration:underline}
.wikilink.missing{font-weight:400;text-decoration:underline dashed}
.sub-h{font-size:var(--fs-lg);line-height:1.19;font-weight:600;margin:0}
.vlist{display:flex;flex-direction:column;border:1px solid var(--hairline);border-radius:var(--radius-md);overflow:hidden}
.vrow{display:grid;grid-template-columns:48px 1fr auto;gap:var(--space-1) var(--space-3);padding:var(--space-3) var(--space-4);border-top:1px solid var(--hairline);align-items:center}
.vrow:first-child{border-top:0}
.vrow .thumb{width:48px;height:64px}
.vrow .t{font-weight:600;min-width:0;word-break:break-word}
.vrow .t a{color:inherit;text-decoration:none}
.picker{background:var(--parchment);border-radius:var(--radius-md);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.picklist{display:flex;flex-direction:column;gap:var(--space-1);max-height:320px;overflow:auto}
.pickrow{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-2) var(--space-3);background:var(--canvas);border-radius:var(--radius-sm);cursor:pointer;font-size:var(--fs-sm);letter-spacing:-0.224px}
.pickrow input{margin-top:3px;width:16px;height:16px;accent-color:var(--action-blue)}
.links-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-5)}
.links-grid h4{margin:0 0 var(--space-2);font-size:var(--fs-sm);letter-spacing:-0.224px}
.none{font-size:var(--fs-sm);letter-spacing:-0.224px;margin:0}

/* 설정 */
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--space-5);align-items:start}
.settings .card{display:flex;flex-direction:column;gap:var(--space-3)}
.settings h2{font-size:var(--fs-lg);line-height:1.19;margin:0}
.settings ol{margin:0;padding-left:var(--space-5);display:flex;flex-direction:column;gap:var(--space-2);font-size:var(--fs-sm);letter-spacing:-0.224px}
.copyrow{display:flex;gap:var(--space-2)}
.copyrow input{flex:1;min-width:0;border:1px solid var(--ink-muted);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);font-size:var(--fs-sm);background:var(--parchment)}
.catlist{display:flex;flex-direction:column;border:1px solid var(--hairline);border-radius:var(--radius-md)}
.catrow{display:flex;gap:var(--space-2);align-items:center;padding:var(--space-2) var(--space-3);border-top:1px solid var(--hairline);font-size:var(--fs-sm)}
.catrow:first-child{border-top:0}
.catrow input{flex:1;min-width:0;border:1px solid transparent;border-radius:var(--radius-sm);padding:var(--space-1) var(--space-2);background:transparent}
.catrow input:focus{border-color:var(--action-blue);outline:none;background:var(--canvas)}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--parchment)}

/* 공유로 들어왔을 때 */
.sheet-back{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0.32);display:flex;align-items:flex-end;justify-content:center;padding:var(--space-3);padding-bottom:calc(var(--space-3) + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:520px;background:var(--canvas);border-radius:var(--radius-lg);box-shadow:var(--shadow-product);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-4)}
.sheet h2{margin:0;font-size:var(--fs-xl);line-height:1.14}
.sheet .itemline{display:grid;grid-template-columns:72px 1fr;gap:var(--space-4);align-items:start}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .25s ease-out both}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + var(--space-5));z-index:50;background:var(--ink);color:var(--canvas);border-radius:var(--radius-pill);padding:var(--space-3) var(--space-5);font-size:var(--fs-sm);max-width:calc(100% - 32px);text-align:center}

/* 휴대폰: 아래쪽 탭 바 */
@media (max-width:700px){
  :root{--tabbar-h:64px}
  main{padding-block:var(--space-5) var(--space-7)}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0;background:var(--canvas);border-top:1px solid var(--hairline);
    display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:var(--space-1) max(8px,env(safe-area-inset-left,0px)) calc(var(--space-1) + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));height:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex-direction:column;gap:2px;border-radius:var(--radius-md);font-size:var(--fs-xs);padding:var(--space-1);position:relative;justify-content:center}
  .tabbar a[aria-current="page"]{background:transparent;color:var(--action-blue);font-weight:600}
  .tabbar svg{display:block;width:24px;height:24px}
  .tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px)}
  .item{grid-template-columns:60px 1fr;padding:var(--space-4)}
  .thumb{width:60px;height:80px}
  .triage{grid-template-columns:1fr;padding:var(--space-4)}
  .triage .tthumb{width:100%;max-height:300px;aspect-ratio:auto;height:240px}
  .triage div.tthumb{height:96px}
  .detail{padding:var(--space-5)}
  .vrow{grid-template-columns:48px 1fr}
  .vrow>.row{grid-column:2}
  h1.page{font-size:var(--fs-lg)}
}
</style>
<script src="config.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#library">Revide</a>
    <nav class="tabbar" aria-label="메뉴">
      <a href="#library" data-view="lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>보관함</a>
      <a href="#inbox" data-view="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 13l2.5-7.5h11L20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 13h4.5l1.5 2.5h4l1.5-2.5H20"/></svg>받은 함<span class="badge" id="inboxBadge" hidden>0</span></a>
      <a href="#notes" data-view="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M14.5 3.5V7.5h4M9 12h6M9 16h6"/></svg>노트</a>
      <a href="#settings" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>설정</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- 보관함 -->
  <section class="view" id="v-lib" aria-labelledby="libH">
    <h1 class="page" id="libH">보관함</h1>
    <form class="addbar" id="addForm" autocomplete="off">
      <input id="urlIn" inputmode="url" aria-label="링크 붙여넣기" placeholder="링크를 붙여넣으면 바로 담겨요">
      <button class="btn" id="addBtn" type="submit" disabled>담기</button>
    </form>
    <div id="libBanners" class="view" style="gap:var(--space-3)"></div>
    <div class="tabs" id="catTabs" role="tablist"></div>
    <div class="tools">
      <input class="search" id="q" type="search" aria-label="제목·캡션·메모로 찾기" placeholder="찾기">
      <div class="seg" id="seenSeg">
        <button type="button" data-f="unseen" aria-pressed="true">안 본 것</button>
        <button type="button" data-f="seen" aria-pressed="false">본 것</button>
        <button type="button" data-f="all" aria-pressed="false">전체</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <!-- 받은 함 -->
  <section class="view" id="v-inbox" hidden aria-labelledby="inboxH">
    <h1 class="page" id="inboxH">받은 함</h1>
    <p class="lede">자동으로 분류하지 못한 영상이에요. 맞는 분류를 한 번 누르면 다음 영상으로 넘어가고, 고른 분류는 기억해 두었다가 비슷한 영상에 알아서 써요.</p>
    <div id="triage"></div>
  </section>

  <!-- 노트 목록 -->
  <section class="view" id="v-notes" hidden aria-labelledby="notesH">
    <h1 class="page" id="notesH">노트</h1>
    <p class="lede">같은 주제의 영상을 노트 하나로 묶고, 내 생각을 마크다운으로 적어 두세요. [[노트 제목]]으로 노트끼리 연결돼요.</p>
    <div class="row">
      <button class="btn" type="button" id="newNoteBtn">새 노트</button>
      <button class="btn line" type="button" id="catGroupBtn">분류별로 묶기</button>
      <button class="btn line" type="button" id="tagGroupBtn">해시태그로 묶기</button>
      <button class="btn line" type="button" id="vaultBtn">옵시디언으로 내보내기</button>
    </div>
    <p id="noteMsg" class="msg" role="status"></p>
    <div id="proposals" class="view" style="gap:var(--space-3)"></div>
    <div class="tools"><input class="search" id="nq" type="search" aria-label="노트 찾기" placeholder="노트 찾기"></div>
    <div class="tabs" id="tagBar"></div>
    <div class="note-grid" id="noteGrid"></div>
  </section>

  <!-- 노트 하나 -->
  <section class="view" id="v-note" hidden></section>

  <!-- 설정 -->
  <section class="view" id="v-settings" hidden aria-labelledby="setH">
    <h1 class="page" id="setH">설정</h1>
    <div class="settings" id="settings"></div>
  </section>
</main>

<div id="shareSheet" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
