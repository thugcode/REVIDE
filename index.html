<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Revide</title>
<meta name="description" content="인스타·유튜브에서 저장만 하고 잊는 숏폼을 자동으로 분류하고, 같은 주제끼리 노트로 묶어 다시 꺼내 보는 보관함">
<meta name="theme-color" content="#000000">
<!-- 카카오톡·인스타 DM 등에 링크를 보낼 때 보이는 미리보기 카드 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Revide">
<meta property="og:title" content="Revide · 저장만 하고 잊던 릴스, 다시 꺼내 보기">
<meta property="og:description" content="인스타·유튜브 링크를 공유하면 알아서 분류하고, 같은 주제끼리 노트로 묶어 줘요. 무료, 구글 로그인으로 바로 시작.">
<meta property="og:url" content="https://thugcode.github.io/REVIDE/">
<meta property="og:image" content="https://thugcode.github.io/REVIDE/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Revide">
<style>
/* ─────────────────────────────────────────────────────────────
   Revide · Apple 디자인 언어
   썸네일이 주인공 · 화면 장식은 최소 · 누르는 것은 파란색 하나
   그림자는 썸네일(사진)에만 · 버튼은 누르면 살짝 작아짐(scale .95)
   ───────────────────────────────────────────────────────────── */
:root{
  /* 색 */
  --ink:#1d1d1f;          /* 모든 본문·제목 */
  --ink-2:#6e6e73;        /* 보조 글자 (흰 바탕 5.1:1 · 연회색 바탕 4.7:1) */
  --canvas:#ffffff;       /* 카드 */
  --parchment:#f5f5f7;    /* 화면 바탕 */
  --pearl:#fafafc;        /* 보조 버튼 바탕 */
  --blue:#0066cc;         /* 누르는 모든 것 */
  --focus:#0071e3;        /* 키보드 초점·선택 테두리 */
  --blue-dark:#2997ff;    /* 어두운 바탕 위 링크 */
  --tile:#272729;         /* 어두운 띠 */
  --black:#000000;        /* 상단 바 */
  --hair:rgba(0,0,0,0.08);/* 얇은 테두리 */
  --hairline:#e0e0e0;
  --glass:rgba(210,210,215,0.64);
  --on-dark-2:#cccccc;
  /* 글자 */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Helvetica Neue",Arial,sans-serif;
  /* 여백 */
  --s1:4px; --s2:8px; --s3:12px; --s4:17px; --s5:24px; --s6:32px; --s7:48px; --s8:80px;
  /* 모서리 */
  --r-sm:8px; --r-md:11px; --r-lg:18px; --r-pill:9999px;
  /* 그림자: 사진에만 */
  --product-shadow:3px 5px 30px 0 rgba(0,0,0,0.22);
  --tabbar-h:0px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--parchment)}
body{color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-0.374px;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--black)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--blue);-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){
  .btn,.chip,.catbtn,.vcard,.ncard,.icon-btn,.tabbar a{transition:transform .12s ease}
}
.btn:active,.chip:active,.catbtn:active,.vcard:active,.ncard:active,.icon-btn:active{transform:scale(.95)}

/* ── 상단 바: 얇은 검정 ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--black);color:#fff}
.top .wrap{display:flex;align-items:center;gap:var(--s5);height:44px}
.brand{font-size:17px;font-weight:600;letter-spacing:-0.2px;color:#fff;text-decoration:none;display:flex;align-items:center;gap:var(--s2)}
.brand svg{width:20px;height:20px}
.tabbar{display:flex;gap:var(--s5);margin-left:auto;align-items:center}
.tabbar a{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,.8);text-decoration:none;font-size:12px;letter-spacing:-0.12px;padding:var(--s2) 0}
.tabbar a:hover{color:#fff}
.tabbar a[aria-current="page"]{color:#fff;font-weight:600}
.tabbar svg{display:none}
.badge{min-width:18px;height:18px;border-radius:var(--r-pill);background:var(--blue);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;letter-spacing:0}

/* ── 페이지 머리 ── */
main{padding-block:var(--s7) var(--s8)}
.view{display:flex;flex-direction:column;gap:var(--s5)}
.head{display:flex;flex-direction:column;gap:var(--s2)}
.head h1{font-size:40px;line-height:1.1;font-weight:600;letter-spacing:-0.28px;margin:0}
.head p,.lede{font-size:17px;color:var(--ink-2);margin:0;max-width:640px}
.sub-h{font-size:21px;line-height:1.19;font-weight:600;letter-spacing:0.231px;margin:0}

/* ── 버튼 ── */
.btn{border:0;border-radius:var(--r-pill);padding:11px 22px;font-size:17px;line-height:1.24;background:var(--blue);color:#fff;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);white-space:nowrap;min-height:44px}
.btn:disabled{background:var(--hairline);color:var(--ink-2);cursor:default;transform:none}
.btn.sm{padding:8px 16px;font-size:14px;letter-spacing:-0.224px;min-height:36px}
.btn.line{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.btn.pearl{background:var(--pearl);color:#333;box-shadow:inset 0 0 0 3px #f0f0f0;border-radius:var(--r-md)}
.btn.quiet{background:transparent;color:var(--blue);padding-inline:var(--s2);min-height:36px}
.btn.danger{color:#b3261e;background:transparent;padding-inline:var(--s2)}
.btn.danger[data-arm]{background:#b3261e;color:#fff;padding-inline:16px}
.btn.dark{background:var(--ink);color:#fff;border-radius:var(--r-sm)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--glass);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none;
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.icon-btn svg{width:18px;height:18px}
.row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.hint{font-size:12px;letter-spacing:-0.12px;color:var(--ink-2);margin:0}
.msg{font-size:14px;letter-spacing:-0.224px;color:var(--ink-2);min-height:1.43em;margin:0}

/* ── 알약 입력칸 (검색·담기) ── */
.field-pill{display:flex;align-items:center;gap:var(--s2);background:var(--canvas);border-radius:var(--r-pill);box-shadow:inset 0 0 0 1px var(--hair);min-height:44px;padding:0 6px 0 18px;min-width:0}
.field-pill:focus-within{box-shadow:inset 0 0 0 2px var(--focus)}
.field-pill svg{width:16px;height:16px;flex:none;color:var(--ink-2)}
.field-pill input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;font-size:17px;outline:none}
.field-pill input::placeholder{color:var(--ink-2)}
.field-pill .btn{min-height:34px;padding:6px 16px;font-size:14px}
.addbar{min-height:56px;padding-left:22px}
.addbar input{font-size:17px}
.toolbar{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.toolbar .field-pill{flex:1 1 260px}

/* ── 분류 칩 (Apple 구성 선택 칩) ── */
.tabs{display:flex;gap:var(--s2);overflow-x:auto;padding:2px 2px var(--s1);scrollbar-width:none;margin-inline:-2px}
.tabs::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--canvas);box-shadow:inset 0 0 0 1px var(--hairline);border-radius:var(--r-pill);padding:8px 16px;font-size:14px;letter-spacing:-0.224px;
  display:inline-flex;align-items:center;gap:6px;line-height:1.29;white-space:nowrap;color:var(--ink);min-height:36px;flex:none}
.chip[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--focus);font-weight:600}
.chip .n{color:var(--ink-2);font-weight:400;font-variant-numeric:tabular-nums}

.stickybar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:15;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:var(--s2) max(16px,env(safe-area-inset-left,0px));background:rgba(245,245,247,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.stickybar .tabs{margin:0;padding:2px}
/* ── 세그먼트 (안 본 것/본 것/전체) ── */
.seg{display:inline-flex;background:rgba(118,118,128,.12);border-radius:var(--r-md);padding:2px;gap:2px;flex:none}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;font-size:14px;letter-spacing:-0.224px;color:var(--ink);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--canvas);font-weight:600;box-shadow:0 0 0 .5px var(--hair)}

/* ── 띠 (안내) ── */
.band{display:flex;gap:var(--s4);align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:var(--r-lg);padding:var(--s5)}
.band.dark{background:var(--tile);color:#fff}
.band.dark p{color:var(--on-dark-2)}
.band.light{background:var(--canvas);box-shadow:inset 0 0 0 1px var(--hair)}
.band h2{font-size:21px;line-height:1.19;font-weight:600;letter-spacing:0.231px;margin:0 0 var(--s1)}
.band p{margin:0;font-size:14px;letter-spacing:-0.224px;color:var(--ink-2)}

/* ── 영상 카드 격자 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s5) var(--s4)}
.vcard{position:relative;display:flex;flex-direction:column;gap:var(--s2);background:transparent;border:0;padding:0;text-align:left;color:var(--ink);min-width:0;cursor:pointer}
.vthumb{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:#e8e8ed}
.vthumb img{width:100%;height:100%;object-fit:cover}
.vthumb .ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s2);color:var(--ink-2);font-size:14px;font-weight:600}
.vthumb .ph svg{width:28px;height:28px}
.vcard:hover .vthumb{box-shadow:var(--product-shadow)}
.ov{position:absolute;display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-pill);padding:3px 9px;font-size:12px;letter-spacing:-0.12px;font-weight:600;
  background:var(--glass);color:var(--ink);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.ov.tl{top:var(--s2);left:var(--s2)}
.ov.tr{top:var(--s2);right:var(--s2)}
.ov.br{bottom:var(--s2);right:var(--s2);padding:4px;border-radius:50%}
.ov.br svg{width:14px;height:14px;display:block}
.ov.seen{background:var(--blue);color:#fff;padding:3px 8px}
.ov.reading{background:rgba(0,0,0,.6);color:#fff}
.vcard.seen .vthumb img{opacity:.55}
.vtitle{font-size:17px;line-height:1.29;font-weight:400;letter-spacing:-0.374px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;padding:0 2px}
.vmeta{font-size:14px;letter-spacing:-0.224px;color:var(--ink-2);padding:0 2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:-4px}
.vmeta .cat{color:var(--ink)}
.empty{padding:var(--s8) var(--s5);display:flex;flex-direction:column;gap:var(--s3);text-align:center;align-items:center;background:var(--canvas);border-radius:var(--r-lg);grid-column:1/-1}
.empty b{font-size:21px;line-height:1.19;font-weight:600}
.empty span{font-size:17px;color:var(--ink-2);max-width:440px}

/* ── 아래에서 올라오는 시트 (영상 상세 · 공유로 담음) ── */
.sheet-back{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;padding:var(--s5)}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100vh - 48px);overflow:auto;background:var(--canvas);border-radius:var(--r-lg);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4);overscroll-behavior:contain}
.sheet .grab{display:none}
.sheet .x{position:absolute;top:var(--s3);right:var(--s3);z-index:2}
.sheet h2{margin:0;font-size:28px;line-height:1.14;font-weight:600;letter-spacing:0.196px;word-break:break-word;padding-right:40px}
.sheet .media{display:grid;grid-template-columns:140px 1fr;gap:var(--s4);align-items:start}
.sheet .media .vthumb{box-shadow:var(--product-shadow)}
.sheet .media .info{min-width:0;display:flex;flex-direction:column;gap:var(--s2)}
.sheet .title{font-size:21px;line-height:1.19;font-weight:600;letter-spacing:0.231px;word-break:break-word}
.sheet .desc{font-size:14px;letter-spacing:-0.224px;color:var(--ink-2);white-space:pre-line;word-break:break-word;margin:0;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.sheet .desc.open{display:block}
.sheet section{display:flex;flex-direction:column;gap:var(--s2)}
.sheet section>b{font-size:14px;font-weight:600;letter-spacing:-0.224px}
.catgrid{display:flex;flex-wrap:wrap;gap:var(--s2)}
.catbtn{border:0;background:var(--canvas);box-shadow:inset 0 0 0 1px var(--hairline);border-radius:var(--r-pill);padding:10px 18px;font-size:15px;min-height:44px;color:var(--ink)}
.catbtn.sug{box-shadow:inset 0 0 0 1px var(--blue);color:var(--blue)}
.catbtn.top,.catbtn[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:none;font-weight:600}
.memo-in,.input{width:100%;min-width:0;border:0;box-shadow:inset 0 0 0 1px var(--hairline);background:var(--canvas);border-radius:var(--r-md);padding:11px 14px;font-size:17px}
.memo-in:focus,.input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--focus)}
.memo-in::placeholder,.input::placeholder{color:var(--ink-2)}
.selpill{border:0;box-shadow:inset 0 0 0 1px var(--hairline);background:var(--canvas);border-radius:var(--r-pill);padding:8px 14px;font-size:14px;min-height:36px;color:var(--ink);max-width:100%}
.divider{height:1px;background:var(--hairline);margin:0}

/* ── 분류함 정리 ── */
.triage{background:var(--canvas);border-radius:var(--r-lg);padding:var(--s6);display:grid;grid-template-columns:240px 1fr;gap:var(--s6);align-items:start}
.triage .vthumb{box-shadow:var(--product-shadow)}
.triage .tbody{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.triage h2{font-size:28px;line-height:1.14;font-weight:600;letter-spacing:0.196px;margin:0;word-break:break-word}
.triage .desc{font-size:14px;letter-spacing:-0.224px;color:var(--ink-2);margin:0;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.reason{font-size:14px;letter-spacing:-0.224px;margin:0}
.progress{display:flex;align-items:center;gap:var(--s3);font-size:14px;color:var(--ink-2)}
.bar{flex:1;max-width:240px;height:4px;border-radius:2px;background:rgba(118,118,128,.16);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:2px}
@media (prefers-reduced-motion:no-preference){.triage{animation:pop .24s ease-out both}@keyframes pop{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}}

/* ── 카드 공통 (설정·노트) ── */
.card{background:var(--canvas);border-radius:var(--r-lg);padding:var(--s5)}
.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s4)}
.ncard{text-decoration:none;background:var(--canvas);border-radius:var(--r-lg);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s2);color:var(--ink);min-width:0}
.ncard .thumbs{display:flex;gap:4px;margin-bottom:var(--s1)}
.ncard .thumbs span,.ncard .thumbs img{width:44px;height:56px;border-radius:var(--r-sm);object-fit:cover;background:#e8e8ed;flex:none}
.ncard h3{font-size:21px;line-height:1.19;font-weight:600;letter-spacing:0.231px;margin:0;word-break:break-word}
.ncard .ex{font-size:14px;letter-spacing:-0.224px;color:var(--ink-2);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ncard .foot{font-size:12px;letter-spacing:-0.12px;color:var(--ink-2);margin-top:auto;font-variant-numeric:tabular-nums}
.tagrow{display:flex;flex-wrap:wrap;gap:var(--s1)}
.tag{font-size:12px;letter-spacing:-0.12px;color:var(--blue);white-space:nowrap}
.prop{background:var(--canvas);border-radius:var(--r-lg);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s2);box-shadow:inset 0 0 0 1px var(--hair)}
.prop h3{margin:0;font-size:21px;line-height:1.19}
.prop ul{margin:0;padding-left:var(--s5);font-size:14px;letter-spacing:-0.224px;color:var(--ink-2)}
.backrow{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap}
.detail{background:var(--canvas);border-radius:var(--r-lg);padding:var(--s6);display:flex;flex-direction:column;gap:var(--s5);min-width:0}
.title-in{width:100%;min-width:0;border:0;background:transparent;font-size:40px;line-height:1.1;font-weight:600;letter-spacing:-0.28px;padding:0}
.title-in:focus{outline:none;box-shadow:0 2px 0 var(--focus)}
.tags-in{width:100%;min-width:0;border:0;box-shadow:inset 0 0 0 1px var(--hairline);border-radius:var(--r-pill);background:var(--canvas);padding:8px 16px;font-size:14px}
.tags-in::placeholder{color:var(--ink-2)}
.tags-in:focus{outline:none;box-shadow:inset 0 0 0 2px var(--focus)}
.editor{width:100%;min-width:0;min-height:360px;border:0;box-shadow:inset 0 0 0 1px var(--hairline);border-radius:var(--r-md);padding:var(--s4);font:inherit;font-size:17px;line-height:1.6;color:var(--ink);background:var(--canvas);resize:vertical}
.editor:focus{outline:none;box-shadow:inset 0 0 0 2px var(--focus)}
.md{min-width:0;word-break:break-word}
.md>*:first-child{margin-top:0}
.md h2{font-size:28px;line-height:1.14;font-weight:600;margin:var(--s6) 0 var(--s2)}
.md h3{font-size:21px;line-height:1.19;font-weight:600;letter-spacing:0.231px;margin:var(--s5) 0 var(--s2)}
.md h4{font-size:17px;font-weight:600;margin:var(--s4) 0 var(--s1)}
.md p{margin:0 0 var(--s3)}
.md ul,.md ol{margin:0 0 var(--s3);padding-left:var(--s5)}
.md ul.tasks{list-style:none;padding-left:0}
.md li{margin:var(--s1) 0}
.md li.task label{display:flex;gap:var(--s2);align-items:flex-start;cursor:pointer}
.md li.task input{margin-top:5px;width:18px;height:18px;accent-color:var(--blue)}
.md li.task.done span{text-decoration:line-through;color:var(--ink-2)}
.md blockquote{margin:0 0 var(--s3);background:var(--parchment);border-radius:var(--r-md);padding:var(--s3) var(--s4)}
.md code{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--parchment);border-radius:5px;padding:0 var(--s1)}
.md pre{background:var(--parchment);border-radius:var(--r-md);padding:var(--s3) var(--s4);overflow-x:auto}
.md pre code{background:transparent;padding:0}
.md hr{border:0;border-top:1px solid var(--hairline);margin:var(--s5) 0}
.md mark{background:#fff3c4;color:var(--ink)}
.wikilink{text-decoration:none;font-weight:600}
.wikilink:hover{text-decoration:underline}
.wikilink.missing{font-weight:400;text-decoration:underline dashed}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s4)}
.vlist .vcard .vtitle{font-size:15px}
.vlist .rm{position:absolute;top:var(--s2);right:var(--s2);z-index:2}
.picker{background:var(--parchment);border-radius:var(--r-md);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.picklist{display:flex;flex-direction:column;gap:var(--s1);max-height:340px;overflow:auto}
.pickrow{display:flex;gap:var(--s3);align-items:center;padding:var(--s2) var(--s3);background:var(--canvas);border-radius:var(--r-md);cursor:pointer;font-size:14px;letter-spacing:-0.224px}
.pickrow input{width:20px;height:20px;accent-color:var(--blue);flex:none}
.pickrow img,.pickrow .pthumb{width:36px;height:46px;border-radius:6px;object-fit:cover;background:#e8e8ed;flex:none}
.links-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s5)}
.links-grid h4{margin:0 0 var(--s2);font-size:14px;letter-spacing:-0.224px}
.none{font-size:14px;letter-spacing:-0.224px;color:var(--ink-2);margin:0}
.notechips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.notechip{border:0;color:var(--blue);background:transparent;box-shadow:inset 0 0 0 1px var(--blue);border-radius:var(--r-pill);padding:6px 14px;font-size:14px;letter-spacing:-0.224px}
.notechip:active{transform:scale(.95)}

/* ── 설정 (묶음 목록) ── */
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--s5);align-items:start}
.settings .card{display:flex;flex-direction:column;gap:var(--s3)}
.settings h2{font-size:21px;line-height:1.19;font-weight:600;letter-spacing:0.231px;margin:0}
.settings ol{margin:0;padding-left:var(--s5);display:flex;flex-direction:column;gap:var(--s2);font-size:14px;letter-spacing:-0.224px}
.settings details summary{cursor:pointer;color:var(--blue);font-size:14px}
.copyrow{display:flex;gap:var(--s2)}
.copyrow input{flex:1;min-width:0;border:0;box-shadow:inset 0 0 0 1px var(--hairline);border-radius:var(--r-md);padding:8px 12px;font-size:14px;background:var(--parchment)}
.catlist{display:flex;flex-direction:column;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--hairline);overflow:hidden}
.catrow{display:flex;gap:var(--s2);align-items:center;padding:6px var(--s2) 6px var(--s3);border-top:1px solid var(--hairline);font-size:15px;min-height:44px}
.catrow:first-child{border-top:0}
.catrow input{flex:1;min-width:0;border:0;border-radius:var(--r-sm);padding:6px 8px;background:transparent}
.catrow input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--focus);background:var(--canvas)}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--parchment)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + var(--s5));z-index:50;background:rgba(29,29,31,.92);color:#fff;
  border-radius:var(--r-pill);padding:12px 22px;font-size:14px;letter-spacing:-0.224px;max-width:calc(100% - 32px);text-align:center;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}

/* ── 휴대폰 ── */
@media (max-width:734px){
  :root{--tabbar-h:56px}
  main{padding-block:var(--s5) var(--s7)}
  .head h1{font-size:34px}
  .top .wrap{justify-content:center}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0;gap:0;display:grid;grid-template-columns:repeat(4,1fr);
    background:rgba(250,250,252,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid rgba(0,0,0,.16);
    padding:4px max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-right,0px));height:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex-direction:column;justify-content:center;gap:2px;color:#8e8e93;font-size:10px;letter-spacing:0;padding:2px;position:relative;font-weight:500}
  .tabbar a[aria-current="page"]{color:var(--blue);font-weight:600}
  .tabbar svg{display:block;width:26px;height:26px}
  .tabbar .badge{position:absolute;top:0;left:calc(50% + 6px)}
  .view{gap:var(--s4)}
  .head p{font-size:15px}
  .band{padding:var(--s4) var(--s4) var(--s4) var(--s5);gap:var(--s3);flex-wrap:nowrap}
  .band h2{font-size:17px;margin:0}
  .band p{display:none}
  .band .btn{min-height:36px;padding:8px 16px;font-size:14px}
  .addbar{min-height:50px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4) var(--s3)}
  .vtitle{font-size:15px;letter-spacing:-0.24px}
  .vmeta{font-size:12px;letter-spacing:-0.12px}
  .sheet-back{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:92vh;padding:var(--s3) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom,0px))}
  .sheet .grab{display:block;width:36px;height:5px;border-radius:3px;background:rgba(60,60,67,.3);margin:0 auto var(--s1)}
  .sheet h2{font-size:24px}
  .sheet .media{grid-template-columns:110px 1fr}
  .triage{grid-template-columns:1fr;padding:var(--s4);gap:var(--s4)}
  .triage .vthumb{max-width:220px;width:60%;margin:0 auto}
  .triage h2{font-size:21px}
  .detail{padding:var(--s4)}
  .title-in{font-size:28px}
  .toolbar .seg{width:100%}
  .toolbar .seg button{flex:1}
  @media (prefers-reduced-motion:no-preference){.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{transform:translateY(40%)}to{transform:none}}}
}
</style>
<script src="config.js?v=5"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4v3.5h3.5"/><path d="M10.5 9.2v5.6l4.6-2.8z" fill="currentColor"/></svg>Revide</a>
    <nav class="tabbar" aria-label="메뉴">
      <a href="#library" data-view="lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="8.5" rx="2"/><rect x="13.5" y="3.5" width="7" height="8.5" rx="2"/><rect x="3.5" y="14.5" width="7" height="6" rx="2"/><rect x="13.5" y="14.5" width="7" height="6" rx="2"/></svg>보관함</a>
      <a href="#inbox" data-view="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 13l2.5-7.5h11L20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 13h4.5l1.5 2.5h4l1.5-2.5H20"/></svg>분류함<span class="badge" id="inboxBadge" hidden>0</span></a>
      <a href="#notes" data-view="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M14.5 3.5V7.5h4M9 12h6M9 16h6"/></svg>노트</a>
      <a href="#settings" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>설정</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- 보관함 -->
  <section class="view" id="v-lib" aria-labelledby="libH">
    <div class="head">
      <h1 id="libH">보관함</h1>
      <p id="libLede">링크를 붙여넣으면 알아서 분류해 둘게요.</p>
    </div>
    <form class="field-pill addbar" id="addForm" autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
      <input id="urlIn" inputmode="url" aria-label="링크 붙여넣기" placeholder="인스타·유튜브 링크 붙여넣기">
      <button class="btn" id="addBtn" type="submit" disabled>담기</button>
    </form>
    <div id="libBanners" class="view" style="gap:var(--s3)"></div>
    <div class="toolbar">
      <label class="field-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="q" type="search" aria-label="제목·캡션·메모로 찾기" placeholder="제목, 캡션, 계정으로 찾기">
      </label>
      <div class="seg" id="seenSeg" role="group" aria-label="보기">
        <button type="button" data-f="unseen" aria-pressed="true">안 본 것</button>
        <button type="button" data-f="seen" aria-pressed="false">본 것</button>
        <button type="button" data-f="all" aria-pressed="false">전체</button>
      </div>
    </div>
    <div class="stickybar"><div class="tabs" id="catTabs" role="tablist" aria-label="분류"></div></div>
    <div class="grid" id="list"></div>
  </section>

  <!-- 분류함 -->
  <section class="view" id="v-inbox" hidden aria-labelledby="inboxH">
    <div class="head">
      <h1 id="inboxH">분류함</h1>
      <p>자동으로 분류하지 못한 영상이에요. 맞는 분류를 한 번 누르면 다음 영상으로 넘어가요.</p>
    </div>
    <div id="triage" class="view" style="gap:var(--s4)"></div>
  </section>

  <!-- 노트 목록 -->
  <section class="view" id="v-notes" hidden aria-labelledby="notesH">
    <div class="head">
      <h1 id="notesH">노트</h1>
      <p>같은 주제의 영상을 노트 하나로 묶고 내 생각을 적어 두세요. [[노트 제목]]으로 노트끼리 연결돼요.</p>
    </div>
    <div class="row">
      <button class="btn" type="button" id="newNoteBtn">새 노트</button>
      <button class="btn line" type="button" id="catGroupBtn">분류별로 묶기</button>
      <button class="btn line" type="button" id="tagGroupBtn">해시태그로 묶기</button>
      <button class="btn quiet" type="button" id="vaultBtn">옵시디언으로 내보내기</button>
    </div>
    <p id="noteMsg" class="msg" role="status"></p>
    <div id="proposals" class="view" style="gap:var(--s3)"></div>
    <label class="field-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <input id="nq" type="search" aria-label="노트 찾기" placeholder="노트 찾기">
    </label>
    <div class="tabs" id="tagBar"></div>
    <div class="note-grid" id="noteGrid"></div>
  </section>

  <!-- 노트 하나 -->
  <section class="view" id="v-note" hidden></section>

  <!-- 설정 -->
  <section class="view" id="v-settings" hidden aria-labelledby="setH">
    <div class="head"><h1 id="setH">설정</h1></div>
    <div class="settings" id="settings"></div>
  </section>
</main>

<div id="itemSheet" hidden></div>
<div id="shareSheet" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="app.js?v=5"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
